name: Build and Release
on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - public/**
      - scripts/**
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: biliprism-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack
        id: pack
      - run: npx playwright install --with-deps chromium
        id: browser
      - run: npm run test:appearance
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: npm run test:moments
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: npm run test:comments
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: npm run test:hydration
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: npm run test:enhancements
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: npm run test:smoke
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-and-package
          path: |
            release/
            tests/artifacts/
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          tag="v$version"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "A newer main commit is available; leaving release creation to that run."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its assets unchanged."
            exit 0
          fi
          gh release create "$tag" "release/BiliPrism-v$version-chromium.zip" "release/SHA256SUMS.txt" --target "$GITHUB_SHA" --title "BiliPrism $tag · 本地使用版" --notes-file docs/RELEASE_NOTES.md
